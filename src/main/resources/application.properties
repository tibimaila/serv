spring.application.name=serv

# ---- Serv ----
serv.data-dir=${SERV_DATA_DIR:./data}

serv.security.pbkdf2-iterations=600000

serv.cors.allowed-origins=http://localhost:5173

# Required, no default. Generate with: openssl rand -base64 48
serv.jwt.secret=${SERV_JWT_SECRET}
serv.jwt.access-token-ttl=15m
serv.jwt.refresh-token-ttl=7d

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

serv.storage.default-drive-quota=10GB
serv.storage.chunk-size=8MB

# Uploads: stream large files to disk 
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.location=${SERV_DATA_DIR:./data}/tmp

server.error.include-message=never
server.error.include-stacktrace=never

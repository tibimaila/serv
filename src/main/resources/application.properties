spring.application.name=serv
server.port=${PORT:8080}
server.servlet.context-path=/serv

spring.jackson.serialization.write-dates-as-timestamps=false


serv.data-dir=${SERV_DATA_DIR:./data}
serv.storage-root=${SERV_STORAGE_ROOT:./drive-data}
serv.presign-ttl-seconds=${SERV_PRESIGN_TTL_SECONDS:900}
serv.multipart-threshold=${SERV_MULTIPART_THRESHOLD:104857600}
serv.part-size=${SERV_PART_SIZE:10485760}
serv.max-drive-size=${SERV_MAX_DRIVE_SIZE:0}
serv.root-email=${SERV_ROOT_EMAIL:admin@serv.local}
serv.root-password=${SERV_ROOT_PASSWORD:"admin"}
serv.cors-origin=${SERV_CORS_ORIGIN:http://localhost:5173}